<style>
/* Layout: одна колонка-лента; липкая шапка (группа, неделя, дни), под ней карточки пар как «талоны» с номером и временем слева */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#141a26; --muted:#5f687a; --line:#dde2ec;
  --accent:#2348c9; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --now:#d9480f; --now-soft:#fff1e8;
  --lec:#2348c9; --sem:#0d8a5d; --oth:#8a4fd1;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#171c27; --ink:#e8ecf4; --muted:#98a1b3; --line:#2a3141;
  --accent:#6f8dff; --accent-ink:#0b1020; --accent-soft:#1f2a4d;
  --now:#ff8a4c; --now-soft:#3a2216;
  --lec:#8ea6ff; --sem:#4fd1a0; --oth:#c19bff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#171c27; --ink:#e8ecf4; --muted:#98a1b3; --line:#2a3141;
  --accent:#6f8dff; --accent-ink:#0b1020; --accent-soft:#1f2a4d;
  --now:#ff8a4c; --now-soft:#3a2216;
  --lec:#8ea6ff; --sem:#4fd1a0; --oth:#c19bff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.groupbtn{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.groupbtn small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.groupbtn b{font:700 18px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.groupbtn b::after{content:" ▾";font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.week{display:flex;align-items:center;gap:8px;padding-block:4px}
.week .arrow{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.week .arrow:active{background:var(--accent-soft)}
.weekinfo{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.weeknum{font-weight:600}
.weeknum .tag{display:inline-block;margin-left:6px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.weekdates{font-size:12px;color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:6px 10px}
.day{border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.day span{font-size:12px;color:var(--muted)}
.day b{font:600 16px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel span,.day.sel b{color:var(--accent-ink)}
.day i{width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.5;margin-top:2px}
.day.empty i{visibility:hidden}
.day.sel i{background:var(--accent-ink);opacity:.8}

.subs{display:flex;gap:6px;padding-bottom:10px}
.subs button{flex:1;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.subs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}

main{padding-block:14px 40px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.dayhead h1{font:700 20px/1.2 var(--f-display);margin:0;text-wrap:balance}
.dayhead span{font-size:13px;color:var(--muted);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:62px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pair .when{padding:12px 0 12px 12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.pair .no{font:700 22px/1 var(--f-display);color:var(--accent)}
.pair .t{font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.pair .what{padding:10px 12px 12px 8px;display:flex;flex-direction:column;gap:10px;min-width:0;border-left:1px dashed var(--line)}
.lesson{display:flex;flex-direction:column;gap:3px;min-width:0}
.lesson+.lesson{border-top:1px dashed var(--line);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--oth)}
.chip.l{color:var(--lec)}
.chip.s{color:var(--sem)}
.chip.sub{background:transparent;border:1px solid var(--line);color:var(--muted)}
.title{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .room{color:var(--ink);font-weight:500}
.note{font-size:12px;color:var(--muted)}
.pair.now{border-color:var(--now);background:var(--now-soft)}
.pair.now .no{color:var(--now)}
.live{font-size:12px;font-weight:600;color:var(--now)}
.live.soon{color:var(--accent)}
.pair.past{opacity:.55}
.gap{font-size:12px;color:var(--muted);text-align:center;padding:2px 0;display:flex;align-items:center;gap:10px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.empty-day{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty-day b{display:block;font:700 18px/1.3 var(--f-display);color:var(--ink);margin-bottom:4px}
.status{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
.status.err{color:var(--now)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{width:100%}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.sheet-head h2{flex:1;margin:0;font:700 20px/1.2 var(--f-display)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.glist{flex:1;overflow-y:auto;padding-block:8px 24px}
.glist h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.gitem{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;font-weight:500;font-variant-numeric:tabular-nums}
.gitem.on{border-color:var(--accent);color:var(--accent)}
.intro{padding:32px 0 8px;color:var(--muted)}
.intro b{display:block;color:var(--ink);font:700 22px/1.25 var(--f-display);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.iconbtn.spin svg{animation:none}}
</style>
<script>
/* тема до первой отрисовки, чтобы не мигало */
(function(){ try { var t = JSON.parse(localStorage.getItem("theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch(e){} })();
</script>

<script>
"use strict";
/* ===== Настройки ===== */
const SHEET_ID = "1DanvEzjehNSvgTfhCUpDaOfoXgIqxs4ndNHOteLO5-I";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=xlsx";
// Понедельник 23.11.2026 — неделя 2; недели чередуются 1/2.
const ANCHOR_MONDAY = new Date(2026, 10, 23);
const ANCHOR_WEEK = 2;
const AUTO_REFRESH_MS = 5 * 60 * 1000;

const DAY_KEYS = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА"];
const DAY_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб"];
const DAY_FULL = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const TYPES = { "л": ["Лекция","l"], "с": ["Семинар","s"] };

/* ===== Хранилище (только на этом телефоне) ===== */
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ===== Разбор таблицы ===== */
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type: "array", cellStyles: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const hiddenRows = new Set();
  (ws["!rows"] || []).forEach((ri, i) => { if (ri && ri.hidden) hiddenRows.add(i); });
  const K = 100000;
  const origin = new Map();
  for (const m of (ws["!merges"] || [])) {
    for (let r = m.s.r; r <= m.e.r; r++) for (let c = m.s.c; c <= m.e.c; c++) origin.set(r*K+c, m.s.r*K+m.s.c);
  }
  const org = (r,c) => origin.has(r*K+c) ? origin.get(r*K+c) : r*K+c;
  const rawAt = k => {
    const cell = ws[XLSX.utils.encode_cell({ r: Math.floor(k/K), c: k%K })];
    if (!cell || cell.v == null) return "";
    return String(cell.w != null ? cell.w : cell.v).replace(/\r/g,"").replace(/[ \t ]+/g," ").replace(/ *\n */g,"\n").trim();
  };
  const info = (r,c) => { const k = org(r,c); return { k, v: rawAt(k) }; };
  const val = (r,c) => rawAt(org(r,c));
  const flat = s => s.replace(/\s+/g,"").toUpperCase();

  // заголовки: дни недели, номера недель, колонки «Отделение, группа» и «Время»
  let dayRow = -1, days = [], weekHeads = [], groupCol = 0, timeCol = 2;
  const scanTo = Math.min(range.e.r, 40);
  for (let r = range.s.r; r <= scanTo; r++) {
    const found = [];
    for (let c = range.s.c; c <= range.e.c; c++) {
      if (org(r,c) !== r*K+c) continue;
      const f = flat(val(r,c));
      if (!f) continue;
      const di = DAY_KEYS.indexOf(f);
      if (di >= 0) found.push({ c, d: di });
      const wm = f.match(/^НЕДЕЛЯ(\d)/);
      if (wm) weekHeads.push({ c, n: +wm[1] });
    }
    if (found.length >= 5 && dayRow < 0) { dayRow = r; days = found; }
  }
  if (dayRow < 0) throw new Error("В таблице не нашлась строка с днями недели");
  for (let r = range.s.r; r <= dayRow; r++) {
    for (let c = range.e.c; c >= range.s.c; c--) {
      const f = flat(val(r,c));
      if (f.startsWith("ОТДЕЛЕНИЕ")) groupCol = c;
      if (f === "ВРЕМЯ") timeCol = c;
    }
  }
  weekHeads.sort((a,b) => a.c - b.c);
  let seen = {};
  days.forEach(d => {
    const head = weekHeads.filter(w => w.c <= d.c).pop();
    if (head) d.w = head.n;
    else { seen[d.d] = (seen[d.d] || 0) + 1; d.w = seen[d.d]; }
  });

  const titleParts = [];
  for (let r = range.s.r; r < dayRow - 2; r++) { const v = val(r, 0); if (v) titleParts.push(v); }

  const groups = {};
  const order = [];
  let cur = null;
  const isGroup = s => /[A-ZА-ЯЁ]{2,}.*\d/i.test(s) && s.length >= 5 && !/^\d+$/.test(s);
  const isTime = s => /\d{1,2}[:.]\d{2}/.test(s);

  for (let r = dayRow + 1; r <= range.e.r; r++) {
    if (hiddenRows.has(r)) continue;
    const g = val(r, groupCol).replace(/\n/g," ");
    if (isGroup(g)) {
      if (!groups[g]) {
        groups[g] = { name: g, hasSub: false, weeks: {} };
        order.push(g);
      }
      cur = groups[g];
    }
    if (!cur) continue;
    if (org(r, timeCol) !== r*K+timeCol) continue;
    const time = val(r, timeCol).replace(/\s/g,"");
    if (!isTime(time)) continue;
    const numRaw = parseInt(val(r, timeCol - 1), 10);

    for (const d of days) {
      const X = d.c;
      const a = info(r, X), b = info(r, X+1), rm = info(r, X+2);
      const ta = info(r+1, X), tb = info(r+1, X+1), trm = info(r+1, X+2);
      let room = (rm.k !== a.k && rm.k !== b.k) ? rm.v : "";
      if (!room && trm.k !== rm.k && trm.k !== ta.k && trm.k !== tb.k) room = trm.v;
      const lessons = [];
      const teacherOf = (cell, t) => (t.k !== cell.k && !isTime(t.v)) ? t.v.replace(/\n/g,", ") : "";
      if (a.k === b.k) {
        if (a.v) lessons.push(makeLesson(a.v, teacherOf(a, ta), room, 0));
      } else {
        if (a.v) lessons.push(makeLesson(a.v, teacherOf(a, ta), room, 1));
        if (b.v) lessons.push(makeLesson(b.v, teacherOf(b, tb), room, 2));
      }
      if (!lessons.length) continue;
      if (lessons.some(l => l.sub)) cur.hasSub = true;
      const wk = cur.weeks[d.w] || (cur.weeks[d.w] = [[],[],[],[],[],[]]);
      const list = wk[d.d];
      const n = isNaN(numRaw) ? list.length + 1 : numRaw;
      list.push({ n, time, lessons });
    }
  }
  return { title: titleParts.join(" · "), order, groups };
}

function makeLesson(text, teacher, room, sub){
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean);
  let title = lines.shift() || "";
  const notes = lines;
  let type = "";
  title = title.replace(/\(\s*([а-яё]{1,4}(?:\s*\/\s*[а-яё]{1,4})*)\.?\s*\)/i, (m, p) => { if (!type) { type = p.toLowerCase().replace(/\s/g,""); return ""; } return m; });
  title = title.replace(/\(([^)]*\d[^)]*)\)/g, (m, p) => { notes.unshift(p.trim()); return ""; });
  title = title.replace(/\s{2,}/g," ").trim();
  // пары «только по датам»: 15.09.2026, 13.10.2026 …
  let dates = null;
  const all = notes.join(" ");
  const found = [...all.matchAll(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/g)];
  if (found.length) {
    dates = found.map(m => { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return y + "-" + (+m[2]) + "-" + (+m[1]); });
  }
  return { title, type, teacher, room, sub, note: notes.join(" · "), dates };
}
function dateKey(d){ return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function typeLabel(t){
  if (!t) return null;
  const parts = t.split("/").map(p => TYPES[p] ? TYPES[p][0] : p.toUpperCase());
  const cls = t.includes("/") ? "" : (TYPES[t] ? TYPES[t][1] : "");
  return [parts.join(" + "), cls];
}

/* ===== Даты и недели ===== */
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function mondayOf(d){ const x = startOfDay(d); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekType(monday){
  const diff = Math.round((monday - ANCHOR_MONDAY) / (7*864e5));
  return ((diff % 2) + 2) % 2 === 0 ? ANCHOR_WEEK : 3 - ANCHOR_WEEK;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function parseRange(t){
  const m = t.match(/(\d{1,2})[:.](\d{2})\D+(\d{1,2})[:.](\d{2})/);
  if (!m) return null;
  return [ +m[1]*60 + +m[2], +m[3]*60 + +m[4] ];
}
function fmtMin(n){ const h = Math.floor(n/60), m = n%60; return h ? (h + " ч" + (m ? " " + m + " мин" : "")) : (m + " мин"); }
function plural(n, a, b, c){ const m10 = n%10, m100 = n%100; return (m10===1 && m100!==11) ? a : (m10>=2 && m10<=4 && (m100<10||m100>=20)) ? b : c; }

/* ===== Состояние ===== */
const now0 = new Date();
const baseMonday = now0.getDay() === 0 ? addDays(mondayOf(now0), 7) : mondayOf(now0);
const state = {
  data: store.get("sched"),
  fetchedAt: store.get("fetchedAt"),
  group: store.get("group"),
  sub: store.get("sub") || 0,
  weekOffset: 0,
  day: now0.getDay() === 0 ? 0 : (now0.getDay()+6)%7,
  picker: false,
  query: "",
  loading: false,
  error: ""
};
if (state.data && state.group && !state.data.groups[state.group]) state.group = null;

/* ===== DOM-помощник ===== */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function svg(path){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width","2"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
  s.innerHTML = path; return s;
}
const ICON_REFRESH = '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>';
const ICON_CLOSE = '<path d="M6 6l12 12M18 6L6 18"/>';
const ICON_THEME = {
  auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
const THEME_NAMES = { auto: "как в системе", light: "светлая", dark: "тёмная" };

/* ===== Тема ===== */
const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function themeMode(){ const t = store.get("theme"); return t === "light" || t === "dark" ? t : "auto"; }
function applyTheme(){
  const mode = themeMode();
  if (mode === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  const dark = mode === "dark" || (mode === "auto" && darkMQ && darkMQ.matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#0e121a" : "#f2f4f8";
  try { if (window.Pary && window.Pary.setDark) window.Pary.setDark(dark); } catch(e){}
}
function cycleTheme(){
  const order = ["auto","light","dark"];
  const next = order[(order.indexOf(themeMode()) + 1) % 3];
  store.set("theme", next); applyTheme(); render(); toast("Тема: " + THEME_NAMES[next]);
}
if (darkMQ) { const f = () => { if (themeMode() === "auto") applyTheme(); }; darkMQ.addEventListener ? darkMQ.addEventListener("change", f) : darkMQ.addListener(f); }
applyTheme();

/* ===== Отрисовка ===== */
const app = document.getElementById("app");
function render(){
  const y = window.scrollY;
  app.replaceChildren();
  if (!state.data) {
    app.append(h("div", { class: "wrap loading" },
      state.error ? h("div", { class: "status err" }, state.error) : "Загружаю расписание…",
      state.error ? h("p", null, h("button", { class: "gitem", onclick: () => refresh(true) }, "Повторить")) : null));
    return;
  }
  if (!state.group || state.picker) { app.append(renderPicker()); setTimeout(() => { const i = document.getElementById("q"); if (i && !state.query) i.focus(); }, 0); return; }
  const g = state.data.groups[state.group];
  const monday = addDays(baseMonday, state.weekOffset*7);
  const wt = weekType(monday);
  const week = (g.weeks[wt]) || [[],[],[],[],[],[]];
  const today = new Date();
  const curMonday = mondayOf(today);

  // шапка
  const head = h("header", null, h("div", { class: "wrap" },
    h("div", { class: "top" },
      h("button", { class: "groupbtn", onclick: () => { state.picker = true; state.query = ""; render(); } },
        h("small", null, "Группа"), h("b", null, g.name)),
      h("button", { class: "iconbtn", "aria-label": "Тема: " + THEME_NAMES[themeMode()], title: "Тема: " + THEME_NAMES[themeMode()], onclick: cycleTheme }, svg(ICON_THEME[themeMode()])),
      h("button", { class: "iconbtn" + (state.loading ? " spin" : ""), "aria-label": "Обновить", onclick: () => refresh(true) }, svg(ICON_REFRESH))
    ),
    h("div", { class: "week" },
      h("button", { class: "arrow", "aria-label": "Предыдущая неделя", onclick: () => { state.weekOffset--; render(); } }, "‹"),
      h("button", { class: "weekinfo", onclick: () => { state.weekOffset = 0; state.day = today.getDay()===0 ? 0 : (today.getDay()+6)%7; render(); } },
        h("span", { class: "weeknum" }, "Неделя " + wt,
          sameDay(monday, curMonday) ? h("span", { class: "tag" }, "текущая") :
          (sameDay(monday, addDays(curMonday,7)) ? h("span", { class: "tag" }, "следующая") : null)),
        h("span", { class: "weekdates" }, fmtRange(monday))),
      h("button", { class: "arrow", "aria-label": "Следующая неделя", onclick: () => { state.weekOffset++; render(); } }, "›")
    ),
    h("div", { class: "days", role: "tablist" }, DAY_SHORT.map((s, i) => {
      const date = addDays(monday, i);
      const has = filterLessons(week[i], date).length > 0;
      return h("button", { class: "day" + (i === state.day ? " sel" : "") + (sameDay(date, today) ? " today" : "") + (has ? "" : " empty"),
        role: "tab", "aria-selected": i === state.day ? "true" : "false", onclick: () => { state.day = i; render(); } },
        h("span", null, s), h("b", null, date.getDate()), h("i"));
    })),
    g.hasSub ? h("div", { class: "subs" }, [["Вся группа",0],["1 подгруппа",1],["2 подгруппа",2]].map(([t,v]) =>
      h("button", { class: state.sub === v ? "on" : "", onclick: () => { state.sub = v; store.set("sub", v); render(); } }, t))) : null
  ));
  app.append(head);

  // день
  const date = addDays(monday, state.day);
  const pairs = filterLessons(week[state.day], date);
  const isToday = sameDay(date, today);
  const nowMin = today.getHours()*60 + today.getMinutes();
  const main = h("main", { class: "wrap" });
  main.append(h("div", { class: "dayhead" },
    h("h1", null, DAY_FULL[state.day] + ", " + date.getDate() + " " + MONTHS[date.getMonth()]),
    h("span", null, pairs.length ? pairs.length + " " + plural(pairs.length,"пара","пары","пар") : "")));

  if (!pairs.length) {
    main.append(h("div", { class: "empty-day" }, h("b", null, "Пар нет"), "В этот день у группы занятий нет."));
  } else {
    const list = h("div", { class: "list" });
    let nextMarked = false;
    pairs.forEach((p, idx) => {
      if (idx > 0) {
        const gap = p.n - pairs[idx-1].n - 1;
        if (gap > 0) list.append(h("div", { class: "gap" }, "окно · " + gap + " " + plural(gap,"пара","пары","пар")));
      }
      const rg = parseRange(p.time);
      let cls = "pair", live = null;
      if (isToday && rg) {
        if (nowMin >= rg[0] && nowMin < rg[1]) { cls += " now"; live = h("span", { class: "live" }, "Идёт сейчас · до конца " + fmtMin(rg[1]-nowMin)); nextMarked = true; }
        else if (nowMin >= rg[1]) cls += " past";
        else if (!nextMarked) { live = h("span", { class: "live soon" }, "Начнётся через " + fmtMin(rg[0]-nowMin)); nextMarked = true; }
      }
      const [t1, t2] = p.time.split(/[-–—]/);
      list.append(h("article", { class: cls },
        h("div", { class: "when" }, h("span", { class: "no" }, p.n), h("span", { class: "t" }, t1 || p.time), t2 ? h("span", { class: "t" }, t2) : null),
        h("div", { class: "what" }, live, p.lessons.map(l => {
          const ty = typeLabel(l.type);
          return h("div", { class: "lesson" },
            (l.type || l.sub || l.dates) ? h("div", { class: "chips" },
              ty ? h("span", { class: "chip " + ty[1] }, ty[0]) : null,
              l.dates ? h("span", { class: "chip sub" }, "только по датам") : null,
              l.sub ? h("span", { class: "chip sub" }, l.sub + " подгруппа") : null) : null,
            h("div", { class: "title" }, l.title || "—"),
            (l.teacher || l.room) ? h("div", { class: "meta" },
              l.room ? h("span", { class: "room" }, (/^\d/.test(l.room) ? "ауд. " : "") + l.room) : null,
              l.teacher ? h("span", null, l.teacher) : null) : null,
            l.note ? h("div", { class: "note" }, l.note) : null);
        }))
      ));
    });
    main.append(list);
  }
  main.append(statusLine());
  app.append(main);
  window.scrollTo(0, y);
}

function filterLessons(pairs, date){
  const dk = dateKey(date);
  return (pairs || []).map(p => ({ ...p, lessons: p.lessons.filter(l =>
      (!state.sub || !l.sub || l.sub === state.sub) && (!l.dates || l.dates.includes(dk))) }))
    .filter(p => p.lessons.length);
}

function fmtRange(mon){
  const sat = addDays(mon, 5);
  return mon.getMonth() === sat.getMonth()
    ? mon.getDate() + "–" + sat.getDate() + " " + MONTHS_SHORT[mon.getMonth()]
    : mon.getDate() + " " + MONTHS_SHORT[mon.getMonth()] + " – " + sat.getDate() + " " + MONTHS_SHORT[sat.getMonth()];
}

function statusLine(){
  if (state.error) return h("div", { class: "status err" }, state.error + (state.fetchedAt ? " Показана версия от " + fmtStamp(state.fetchedAt) + "." : ""));
  if (state.loading) return h("div", { class: "status" }, "Обновляю…");
  return h("div", { class: "status" }, state.fetchedAt ? "Обновлено " + fmtStamp(state.fetchedAt) : "");
}
function fmtStamp(ts){
  const d = new Date(ts), t = new Date();
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return sameDay(d, t) ? "сегодня в " + hm : d.getDate() + " " + MONTHS[d.getMonth()] + " в " + hm;
}

function courseOf(name){
  const m = name.match(/(\d{2})-/);
  if (!m) return "Другие";
  const t = new Date();
  const acad = t.getMonth() >= 7 ? t.getFullYear() : t.getFullYear() - 1;
  const c = acad - (2000 + +m[1]) + 1;
  return c >= 1 && c <= 6 ? c + " курс" : "Набор 20" + m[1];
}

function renderPicker(){
  const q = state.query.trim().toLowerCase();
  const names = state.data.order.filter(n => !q || n.toLowerCase().includes(q));
  const byCourse = {};
  names.forEach(n => { const c = courseOf(n); (byCourse[c] = byCourse[c] || []).push(n); });
  const list = h("div", { class: "glist wrap" });
  if (!state.group) list.append(h("div", { class: "intro" }, h("b", null, "Выберите свою группу"), "Приложение запомнит выбор. Сменить группу можно в любой момент, нажав на её название."));
  Object.keys(byCourse).sort().forEach(c => {
    list.append(h("h3", null, c));
    byCourse[c].forEach(n => list.append(h("button", { class: "gitem" + (n === state.group ? " on" : ""), onclick: () => {
      state.group = n; store.set("group", n); state.picker = false; state.sub = 0; store.set("sub", 0); render(); window.scrollTo(0,0);
    } }, n)));
  });
  if (!names.length) list.append(h("div", { class: "intro" }, "Группа не найдена. Проверьте написание."));
  const input = h("input", { id: "q", class: "search", type: "search", placeholder: "Поиск: ИТ01, ФИН, 26…", value: state.query, autocomplete: "off",
    oninput: e => { state.query = e.target.value; const pos = e.target.selectionStart; render(); const i = document.getElementById("q"); i.focus(); i.setSelectionRange(pos,pos); } });
  return h("div", { class: "sheet" },
    h("div", { class: "wrap" },
      h("div", { class: "sheet-head" }, h("h2", null, "Группа"),
        state.group ? h("button", { class: "iconbtn", "aria-label": "Закрыть", onclick: () => { state.picker = false; render(); } }, svg(ICON_CLOSE)) : null),
      input),
    list);
}

let toastTimer;
function toast(text){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, text);
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}

/* ===== Загрузка из Google Таблицы ===== */
async function refresh(manual){
  if (state.loading) return;
  if (typeof XLSX === "undefined") { state.error = "Нет связи: не удалось загрузить приложение полностью."; render(); return; }
  state.loading = true; if (!state.picker) render();
  try {
    const res = await fetch(SHEET_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const parsed = parseWorkbook(await res.arrayBuffer());
    const prev = state.data;
    const changed = prev && JSON.stringify(prev.groups) !== JSON.stringify(parsed.groups);
    state.data = parsed; state.fetchedAt = Date.now(); state.error = "";
    store.set("sched", parsed); store.set("fetchedAt", state.fetchedAt);
    if (state.group && !parsed.groups[state.group]) { state.group = null; }
    if (changed) toast("Расписание обновилось");
    else if (manual) toast("Изменений нет");
  } catch (e) {
    state.error = navigator.onLine === false ? "Нет интернета." : "Не удалось обновить расписание.";
    console.error(e);
  }
  state.loading = false;
  if (!state.picker) render();
}

/* свайп влево/вправо — соседний день */
let tx = null, ty = null;
document.addEventListener("touchstart", e => { if (state.picker || !state.group) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.7) return;
  if (dx < 0) { if (state.day < 5) state.day++; else { state.day = 0; state.weekOffset++; } }
  else { if (state.day > 0) state.day--; else { state.day = 5; state.weekOffset--; } }
  render(); window.scrollTo(0,0);
}, { passive: true });

let lastFetch = 0;
function autoRefresh(){ if (Date.now() - lastFetch > 60000) { lastFetch = Date.now(); refresh(false); } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { autoRefresh(); render(); } });
setInterval(() => { if (document.visibilityState === "visible") { lastFetch = Date.now(); refresh(false); } }, AUTO_REFRESH_MS);
setInterval(() => { if (document.visibilityState === "visible" && !state.picker && !state.loading) render(); }, 60000);

render();
autoRefresh();

/* счётчик установок: один раз с каждого телефона, без личных данных */
const COUNTER_URL = "https://hits.sh/raspisanie-pary.app/installs-v9f3.svg";
if (!store.get("counted") && /^https?:/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname)) {
  const img = new Image();
  img.onload = () => store.set("counted", Date.now());
  img.src = COUNTER_URL;
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
